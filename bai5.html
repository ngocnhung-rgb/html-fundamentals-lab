  <title>Bài 5 - Image and Text Demonstration</title>

<body>
  <h1>IMAGES</h1>

  <p>
    <img src="images/scene.jpg" alt="Glacier landscape left" width="250" align="left">
    A paragraph with an image. The align attribute of the image is set to "left". The image will float to the left of this text.
  </p>

  <br clear="all">
  <br>

  <p>
    <img src="images/scene.jpg" alt="Glacier landscape right" width="250" align="right">
    A paragraph with an image. The align attribute of the image is set to "right". The image will float to the right of this text.
  </p>

  <p style="clear: both;"><br><a href="index.html">← Quay lại trang chủ</a></p>
</body>
